    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: #FCF2ED;
            border: 1px solid #EAE1DC;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Logo Section */
        .logo-section {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: #F8EAE4;
            border-radius: 16px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: contain;
        }

        /* Login Title */
        .login-title {
            text-align: center;
            color: #4A3B32;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .error-message{
            background:#FEE2E2;
            color:#B91C1C;
            padding:12px;
            border-radius:12px;
            margin-bottom:16px;
            text-align:center;
            font-size:14px;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Form Group */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            color: #4A3B32;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            padding-left: 0.25rem;
        }

        /* Input Container */
        .input-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #F4E3DC;
            border-radius: 9999px;
            padding: 1rem 1.5rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: #D35400;
            box-shadow: 0 0 0 3px rgba(211, 84, 0, 0.1);
        }

        .input-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-icon svg {
            width: 20px;
            height: auto;
            color: #4A3B32;
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #4A3B32;
            padding: 0;
        }

        .input-container input::placeholder {
            color: #8D7B72;
        }

        /* Password Toggle Button */
        .password-toggle {
            flex-shrink: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .password-toggle:hover {
            opacity: 0.7;
        }

        .password-toggle svg {
            width: 19px;
            height: auto;
            color: #4A3B32;
        }

        /* Submit Button */
        .submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #D35400;
            color: #FFF;
            border: none;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 2rem;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-title {
                font-size: 12px;
                margin-bottom: 1.5rem;
            }

            .input-container {
                padding: 0.875rem 1.25rem;
            }

            .input-container input {
                font-size: 15px;
            }

            .submit-btn {
                padding: 0.875rem 1.25rem;
                font-size: 15px;
                margin-top: 1.5rem;
            }
        }

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

    </script>
